version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: ai-interview-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-dev123456}
      MYSQL_DATABASE: ai_interview
      TZ: Asia/Shanghai
      MYSQL_INITDB_ARGS: --default-character-set=utf8mb4
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./sql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${DB_PASSWORD:-dev123456}"]
      interval: 10s
      timeout: 5s
      retries: 5
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci

  chroma:
    image: chromadb/chroma:0.5.3
    container_name: ai-interview-chroma
    ports:
      - "8000:8000"
    volumes:
      - chroma_data:/chroma/chroma
    environment:
      - IS_PERSISTENT=TRUE

volumes:
  mysql_data:
  chroma_data:
