# GitHub Actions 在云端构建前后端，打包上传到阿里云 ECS 安装（服务器无需 Maven/Node）
#
# Secrets: SSH_HOST, SSH_USER, SSH_PRIVATE_KEY
# 可选: SSH_PORT (默认 22), Variables: APP_DIR (默认 /opt/ai-interview)

name: Deploy to Aliyun ECS

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build backend
        run: mvn -B -f backend/pom.xml package -DskipTests

      - name: Build frontend
        run: |
          cd frontend
          npm ci
          npm run build

      - name: Pack release
        run: |
          rm -rf /tmp/ai-interview-release
          mkdir -p /tmp/ai-interview-release/dist
          cp backend/target/ai-interview-backend-1.0.0-SNAPSHOT.jar /tmp/ai-interview-release/
          cp -r frontend/dist/. /tmp/ai-interview-release/dist/
          tar czf release.tar.gz -C /tmp/ai-interview-release .
          ls -lh release.tar.gz

      - name: Sync deploy scripts on server
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          command_timeout: 5m
          script: |
            set -e
            APP_DIR="${{ vars.APP_DIR || '/opt/ai-interview' }}"
            BRANCH="${{ github.ref_name }}"
            if [[ -d "$APP_DIR/.git" ]]; then
              cd "$APP_DIR"
              git fetch origin "$BRANCH"
              git reset --hard "origin/$BRANCH"
            fi

      - name: Upload release bundle
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          source: release.tar.gz
          target: /tmp

      - name: Install on server
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          command_timeout: 10m
          script: |
            set -e
            APP_DIR="${{ vars.APP_DIR || '/opt/ai-interview' }}"
            RELEASE_TAR="/tmp/release.tar.gz"
            INSTALL_SCRIPT="${APP_DIR}/deploy/scripts/install-artifacts.sh"
            if [[ ! -f "$RELEASE_TAR" ]]; then
              echo "错误: 找不到 ${RELEASE_TAR}"
              ls -la /tmp/
              exit 1
            fi
            if [[ ! -f "$INSTALL_SCRIPT" ]]; then
              echo "错误: 找不到 ${INSTALL_SCRIPT}，请确认 install-artifacts.sh 已 push 到 GitHub"
              exit 1
            fi
            chmod +x "$INSTALL_SCRIPT"
            bash "$INSTALL_SCRIPT" "$RELEASE_TAR"
