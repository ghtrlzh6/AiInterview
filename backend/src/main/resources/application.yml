server:
  port: 8080

spring:
  application:
    name: ai-interview
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:3306/ai_interview?useUnicode=true&characterEncoding=utf8mb4&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: 6379
      password: ${REDIS_PASSWORD:}
      database: 0
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  jackson:
    date-format: yyyy-MM-dd'T'HH:mm:ss
    time-zone: Asia/Shanghai
    default-property-inclusion: non_null

mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  type-aliases-package: com.aiinterview.entity
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: isDeleted
      logic-delete-value: 1
      logic-not-delete-value: 0
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

jwt:
  secret: ${JWT_SECRET:ai-interview-jwt-secret-key-256bits-minimum!!}
  expire: 7200
  refresh-expire: 604800

ai:
  llm:
    provider: deepseek
    api-key: ${LLM_API_KEY:}
    base-url: https://api.deepseek.com/v1
    model: deepseek-chat
    embed-model: deepseek-embed
    max-tokens: 4096
    temperature: 0.7
  asr:
    provider: web-speech
  chroma:
    host: ${CHROMA_HOST:localhost}
    port: 8000
    collection-prefix: ai_interview_

app:
  upload-dir: ${UPLOAD_DIR:./uploads}
  share-base-url: ${SHARE_BASE_URL:http://localhost/share}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    com.aiinterview: debug
    org.springframework.security: info
