server:
  port: 8080

spring:
  application:
    name: ai-interview
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:3306/ai_interview?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:dev123456}
    driver-class-name: com.mysql.cj.jdbc.Driver
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  jackson:
    date-format: yyyy-MM-dd'T'HH:mm:ss
    time-zone: Asia/Shanghai
    default-property-inclusion: non_null

mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  type-aliases-package: com.aiinterview.entity
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: isDeleted
      logic-delete-value: 1
      logic-not-delete-value: 0
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

jwt:
  secret: ${JWT_SECRET:ai-interview-jwt-secret-key-256bits-minimum!!}
  expire: 7200
  refresh-expire: 604800

ai:
  llm:
    provider: deepseek
    api-key: ${LLM_API_KEY:}
    base-url: https://api.deepseek.com/v1
    model: deepseek-chat
    embed-model: deepseek-embed
    max-tokens: 4096
    temperature: 0.7
  asr:
    provider: ${ASR_PROVIDER:web-speech}
  xunfei:
    enabled: true
    app-id: b99ba67b
    api-key: d13a30015ef51f76a81ba802d0c7bdb6
    api-secret: M2Y0NDg2ZGQ5NjZlYWQxYzI5NGU1ZjI3
    asr-url: wss://rtasr.xfyun.cn/v1/ws
  chroma:
    host: ${CHROMA_HOST:localhost}
    port: 8000
    collection-prefix: ai_interview_

# 代码沙箱（Piston）
# 公共 API 自 2026-02-15 起需 PISTON_API_KEY；推荐自建实例并指向本地地址（无需 Key）
# 公共: https://emkc.org/api/v2/piston/execute
# 自建: http://localhost:2000/api/v2/execute
piston:
  api-url: ${PISTON_API_URL:https://emkc.org/api/v2/piston/execute}
  api-key: ${PISTON_API_KEY:}

app:
  upload-dir: ${UPLOAD_DIR:./uploads}
  share-base-url: ${SHARE_BASE_URL:http://localhost:5173/share}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    com.aiinterview: debug
    org.springframework.security: info
