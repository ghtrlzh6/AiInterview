# AI 模拟面试平台 - Nginx 站点配置模板
# 复制到 /etc/nginx/sites-available/ 并修改 server_name

server {
    listen 80;
    server_name your-domain.com;  # 改为你的域名或 IP

    # 前端静态资源
    root /var/www/ai-interview;
    index index.html;

    # Vue Router history 模式
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 后端 API 反向代理
    location /api/ {
        proxy_pass http://127.0.0.1:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE 流式面试对话
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Swagger（生产环境可按需关闭或限制 IP）
    location /swagger-ui.html {
        proxy_pass http://127.0.0.1:8080/swagger-ui.html;
    }

    location /v3/api-docs {
        proxy_pass http://127.0.0.1:8080/v3/api-docs;
    }

    # 静态资源缓存
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    client_max_body_size 12m;
}
